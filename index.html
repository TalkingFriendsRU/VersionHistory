<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TalkingFriendsRU</title>
<link rel="icon" type="image/jpeg" href="./logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
<div class="wrap topbar-inner">
<a class="brand" href="./index.html"><img class="brand-mark" src="./logo.jpg" alt="TalkingFriendsRU"><span>TalkingFriendsRU</span></a>
</div>
</header>
<main class="wrap">
<section class="hero">
<div class="eyebrow">КАТАЛОГ ПРИЛОЖЕНИЙ</div>
<h1>История приложений<br><span>в одном месте</span></h1>
<p>Поиск, платформ и истории их версий.</p>
<label class="search-box">
<span>⌕</span>
<input id="search" type="search" placeholder="Поиск по названию..." autocomplete="off">
</label>
</section>
<section class="controls">
<div class="control-grid">
<label class="select-wrap">
<span>Статус</span>
<select id="status">
<option value="all">Все</option>
<option value="available">Доступные</option>
<option value="removed">Удалённые</option>
</select>
</label>
<label class="select-wrap">
<span>Сортировка</span>
<select id="sort">
<option value="new">Сначала новые</option>
<option value="old">Сначала старые</option>
<option value="az">Название: А–Я</option>
<option value="za">Название: Я–А</option>
</select>
</label>
</div>
</section>
<section class="catalog-head">
<div>
<h2>Каталог</h2>
<p id="count">Загрузка…</p>
</div>
</section>
<section id="grid" class="grid" aria-live="polite"></section>
<div id="error" class="error hidden"></div>
</main>
<footer class="footer wrap">TalkingFriendsRU · t.me/TalkingFriendsRU</footer>
<script src="./app.js"></script>
</body>
</html>
